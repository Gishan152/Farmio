server:
  port: 8080

spring:
  application:
    name: api-gateway
#  main:
#    web-application-type=reactive:

  cloud:
    gateway:
      default-filters:
        - name: AuthenticationFilter
      routes:
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/products/**
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
  security:
    user:
      name: farmio
      password: farmio

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka

jwt:
  secret: your256bitsecretyour256bitsecretyour256bitsecret # Generate using: openssl rand -base64 32
  expiration: 86400000 # 24 hours
