# Server
server:
  port: 8086

# Database
spring:
  application:
    name: order-service
  cloud:
    config:
      import-check:
        enabled: false
  rabbitmq:
    host: rabbitmq
    port: 5672

  datasource:
    url: jdbc:postgresql://postgres:5432/orderdb
    username: postgres
    password: farmio@1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
management:
  endpoints:
    web:
      exposure:
        include: "*"
    health:
      show-components: always
      show-details: always
      db:
        enabled: true
  security:
    enabled: false

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka