services:
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI
    container_name: rabbitmq-farmio
    networks:
      - spring-net

  eureka-server:
    build:
      context: ./eureka-server
    container_name: eureka-server-farmio
    depends_on:
      - rabbitmq
    ports:
      - "8761:8761"
    networks:
      - spring-net

  product-service:
    build:
      context: ./product-service
    container_name: product-service-test
    depends_on:
      - eureka-server
      - rabbitmq
    environment:
      - SERVER_PORT=8081
      - SPRING_APPLICATION_NAME=product-service
    ports:
      - "8081:8081"
    networks:
      - spring-net

  product-service2:
    build:
      context: ./product-service
    container_name: product-service2-test
    depends_on:
      - eureka-server
      - rabbitmq
    environment:
      - SERVER_PORT=8082
      - SPRING_APPLICATION_NAME=product-service
    ports:
      - "8082:8082"
    networks:
      - spring-net

  test-service:
    build:
      context: ./test-service
    container_name: test-service
    depends_on:
      - product-service
      - eureka-server
      - rabbitmq
    environment:
      - SERVER_PORT=8083
      - SPRING_APPLICATION_NAME=test-service
    ports:
      - "8083:8083"
    networks:
      - spring-net

  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    depends_on:
      - eureka-server
      - rabbitmq
    environment:
      - SERVER_PORT=8085
      - SPRING_APPLICATION_NAME=auth-service
    ports:
      - "8085:8085"
    networks:
      - spring-net

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway-farmio
    depends_on:
      - rabbitmq
      - eureka-server
      - product-service
      - auth-service
    ports:
      - "8080:8080"
    networks:
      - spring-net

networks:
  spring-net:
