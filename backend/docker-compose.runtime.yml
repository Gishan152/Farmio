services:
  postgres:
    image: postgres:17.5
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: farmio@1234
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - spring-net
    profiles: ["essential", "full"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    container_name: rabbitmq-farmio
    networks:
      - spring-net
    profiles: ["essential", "full"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  eureka-server:
    build:
      context: ./shared
      dockerfile: Dockerfile.runtime
    container_name: eureka-server-farmio
    hostname: eureka-server
    depends_on:
      - rabbitmq
    environment:
      - SERVER_PORT=8761
      - SPRING_APPLICATION_NAME=eureka-server
    ports:
      - "8761:8761"
    networks:
      - spring-net
    volumes:
      - ./eureka-server/target/eureka-server-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    command: ["java", "-jar", "/app/app.jar"]
    profiles: ["essential", "full"]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'

  api-gateway:
    build:
      context: ./shared
      dockerfile: Dockerfile.runtime
    container_name: api-gateway-farmio
    depends_on:
      - rabbitmq
      - eureka-server
      - auth-service
    environment:
      - SERVER_PORT=8080
      - SPRING_APPLICATION_NAME=api-gateway
    ports:
      - "8080:8080"
    networks:
      - spring-net
    volumes:
      - ./api-gateway/target/api-gateway-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    command: ["java", "-jar", "/app/app.jar"]
    profiles: ["essential", "full"]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'

  auth-service:
