services:
  postgres:
    image: postgres:17.5
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: farmio@1234
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - spring-net

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI
    container_name: rabbitmq-farmio
    networks:
      - spring-net

  eureka-server:
    build:
      context: ./
      dockerfile: ./eureka-server/Dockerfile.dev
    container_name: eureka-server-farmio
    hostname: eureka-server
    depends_on:
      - rabbitmq
    ports:
      - "8761:8761"
    networks:
      - spring-net
    volumes:
      - ./eureka-server:/app/service
    develop:
      watch:
        - action: rebuild
          path: ./eureka-server/target/*-SNAPSHOT.jar

  product-service:
    build:
      context: ./
      dockerfile: ./product-service/Dockerfile.dev
    container_name: product-service-test
    depends_on:
      - eureka-server
      - rabbitmq
    environment:
      - SERVER_PORT=8081
      - SPRING_APPLICATION_NAME=product-service
    ports:
      - "8081:8081"
    networks:
      - spring-net
    volumes:
      - ./product-service:/app/service
    develop:
      watch:
        - action: rebuild
          path: ./product-service/target/*-SNAPSHOT.jar


  product-service2:
    build:
      context: ./
      dockerfile: ./product-service/Dockerfile.dev
    container_name: product-service2-test
    depends_on:
      - eureka-server
      - rabbitmq
    environment:
      - SERVER_PORT=8082
      - SPRING_APPLICATION_NAME=product-service
    ports:
      - "8082:8082"
    networks:
      - spring-net
    volumes:
      - ./product-service:/app/service
    develop:
      watch:
        - action: rebuild
          path: ./product-service/target/*-SNAPSHOT.jar

  order-service:
    build:
      context: ./
      dockerfile: ./order-service/Dockerfile.dev
    container_name: order-service
    depends_on:
      - eureka-server
      - rabbitmq
    environment:
      - SERVER_PORT=8086
      - SPRING_APPLICATION_NAME=order-service
    ports:
      - "8086:8086"
    networks:
      - spring-net
    volumes:
      - ./order-service:/app/service
    develop:
      watch:
        - action: rebuild
          path: ./order-service/target/*-SNAPSHOT.jar

  test-service:
    build:
      context: ./
      dockerfile: ./test-service/Dockerfile.dev
    container_name: test-service
    depends_on:
      - product-service
      - eureka-server
      - rabbitmq
    environment:
      - SERVER_PORT=8083
      - SPRING_APPLICATION_NAME=test-service
    ports:
      - "8083:8083"
    networks:
      - spring-net
    volumes:
      - ./test-service:/app/service
    develop:
      watch:
        - action: rebuild
          path: ./test-service/target/*-SNAPSHOT.jar


  auth-service:
    build:
      context: ./
      dockerfile: ./auth-service/Dockerfile.dev
    container_name: auth-service
    depends_on:
      - eureka-server
      - rabbitmq
      - postgres
    environment:
      - SERVER_PORT=8085
      - SPRING_APPLICATION_NAME=auth-service
    ports:
      - "8085:8085"
    networks:
      - spring-net
    volumes:
      - ./auth-service:/app/service
    develop:
      watch:
        - action: rebuild
          path: ./auth-service/target/*-SNAPSHOT.jar


  api-gateway:
    build:
      context: ./
      dockerfile: ./api-gateway/Dockerfile.dev
    container_name: api-gateway-farmio
    depends_on:
      - rabbitmq
      - eureka-server
#      - product-service
      - auth-service
    ports:
      - "8080:8080"
    networks:
      - spring-net
    volumes:
      - ./api-gateway:/app/service
    develop:
      watch:
        - action: rebuild
          path: ./api-gateway/target/*-SNAPSHOT.jar


volumes:
  pgdata:

networks:
  spring-net:
